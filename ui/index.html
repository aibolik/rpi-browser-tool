<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi browser</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5; --bar: #ffffff; --text: #18181b; --muted: #71717a; --border: #e4e4e7;
    --agent: #e0e7ff; --agent-text: #3730a3; --human: #dcfce7; --human-text: #166534;
    --banner: #fef3c7; --banner-text: #78350f; --button: #18181b; --button-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --bar: #18181b; --text: #fafafa; --muted: #a1a1aa; --border: #27272a;
      --agent: #1e1b4b; --agent-text: #c7d2fe; --human: #052e16; --human-text: #bbf7d0;
      --banner: #451a03; --banner-text: #fde68a; --button: #fafafa; --button-text: #18181b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bar);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; }
  .pill { padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  .pill.agent { background: var(--agent); color: var(--agent-text); }
  .pill.human { background: var(--human); color: var(--human-text); }
  .spacer { flex: 1; }
  #conn { color: var(--muted); }
  button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 6px; border: 0;
           background: var(--button); color: var(--button-text); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #banner { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            background: var(--banner); color: var(--banner-text); border-bottom: 1px solid var(--border); }
  #banner[hidden] { display: none; }
  #banner p { margin: 0; flex: 1; font-size: 15px; }
  #screen { flex: 1; min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>Pi browser</h1>
  <span id="pill" class="pill agent">Agent is driving — view only</span>
  <button id="toggle">Take over</button>
  <span class="spacer"></span>
  <span id="conn">Connecting…</span>
</header>
<div id="banner" hidden>
  <p><strong>The agent needs you:</strong> <span id="message"></span></p>
  <button id="done">Done</button>
</div>
<div id="screen"></div>
<script type="module">
  import RFB from '/novnc/core/rfb.js';

  const $ = (id) => document.getElementById(id);
  let state = { control: 'agent', handoff: null };
  let rfb = null;

  const post = (path) => fetch(path, { method: 'POST' });

  function render() {
    const agent = state.control === 'agent';
    $('pill').className = `pill ${state.control}`;
    $('pill').textContent = agent ? 'Agent is driving — view only' : 'You have control';
    $('toggle').textContent = agent ? 'Take over' : 'Give back';
    const open = state.handoff && !state.handoff.resolvedAt;
    $('banner').hidden = !open;
    $('message').textContent = open ? state.handoff.message : '';
    if (rfb) rfb.viewOnly = agent;
  }

  $('toggle').onclick = () => post(state.control === 'agent' ? '/take' : '/release');
  $('done').onclick = () => post('/done');

  const events = new EventSource('/events');
  events.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  events.onerror = () => { $('conn').textContent = 'UI server unreachable, retrying…'; };

  function connectVnc() {
    $('conn').textContent = 'Connecting…';
    rfb = new RFB($('screen'), `ws://${location.host}/vnc`);
    rfb.scaleViewport = true;
    rfb.viewOnly = state.control === 'agent';
    rfb.addEventListener('connect', () => { $('conn').textContent = 'Connected'; });
    rfb.addEventListener('disconnect', () => {
      rfb = null;
      $('conn').textContent = 'Disconnected, retrying in 2 s…';
      setTimeout(connectVnc, 2000);
    });
  }
  render();
  connectVnc();
</script>
</body>
</html>
